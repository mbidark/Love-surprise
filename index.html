<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PROJECT: SINU — 3D LOVE EXPERIENCE</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: none;
      position: fixed;
      width: 100%;
      height: 100%;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    #canvas-container canvas { display: block; }

    /* ---- Logo Flash ---- */
    #logo-layer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 100;
      transition: opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #logo-svg {
      width: 160px;
      height: 160px;
      filter: drop-shadow(0 0 22px rgba(255, 40, 80, 0.85)) drop-shadow(0 0 55px rgba(255, 0, 0, 0.4));
      animation: logoPulse 2.6s ease-in-out infinite alternate;
    }
    @keyframes logoPulse {
      0% { filter: drop-shadow(0 0 14px #ff2a4d) drop-shadow(0 0 34px #ff0000); transform: scale(0.98); }
      100% { filter: drop-shadow(0 0 30px #ff5e7a) drop-shadow(0 0 70px #ff3333); transform: scale(1.02); }
    }
    #logo-flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 110;
      transition: opacity 0.25s ease-out;
    }
    #logo-flash.active { opacity: 0.85; transition: opacity 0.08s ease-in; }

    /* ---- Matrix Intro (Pink) ---- */
    #matrix-layer {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #matrix-canvas { display: block; width: 100%; height: 100%; opacity: 0.7; }
    #love-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff5e9c;
      font-size: clamp(2rem, 12vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      text-shadow: 0 0 18px #ff3d7f, 0 0 42px #ff1a5e, 0 0 80px #cc0044;
      font-family: 'Courier New', monospace;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 1.6s ease;
      pointer-events: none;
      z-index: 55;
      padding-left: 0.22em;
    }
    #love-text .cursor {
      display: inline-block;
      width: 0.08em;
      height: 1em;
      background: #ff5e9c;
      margin-left: 0.05em;
      vertical-align: -0.12em;
      box-shadow: 0 0 14px #ff3d7f;
      animation: blink 0.8s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ---- Love Letter (Cool Glass Card) ---- */
    #letter-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s cubic-bezier(0.23, 1, 0.32, 1);
      padding: calc(1.2rem + var(--safe-top)) 1.2rem calc(1.2rem + var(--safe-bottom));
    }
    #letter-overlay.visible { opacity: 1; pointer-events: auto; }

    .letter-card {
      max-width: 92vw;
      width: 560px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 3rem 2.2rem 2.4rem;
      background: linear-gradient(145deg, rgba(30, 10, 22, 0.92), rgba(10, 4, 12, 0.96));
      border-radius: 32px;
      position: relative;
      color: #fce8ef;
      font-family: 'Georgia', 'Times New Roman', serif;
      transform: scale(0.9) translateY(16px);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      -webkit-overflow-scrolling: touch;
      box-shadow:
        0 0 0 1px rgba(255, 100, 140, 0.15),
        0 30px 80px rgba(180, 0, 50, 0.35),
        0 0 120px rgba(255, 30, 80, 0.15),
        inset 0 1px 0 rgba(255, 180, 200, 0.15);
      isolation: isolate;
    }
    /* Animated gradient border */
    .letter-card::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 34px;
      padding: 2px;
      background: linear-gradient(120deg, #ff3d7f, #ff8098, #ff1a5e, #ff5e9c, #ff3d7f);
      background-size: 300% 300%;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: borderFlow 5s linear infinite;
      z-index: -1;
      opacity: 0.7;
    }
    @keyframes borderFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    #letter-overlay.visible .letter-card { transform: scale(1) translateY(0); }

    /* Inner glow overlay */
    .letter-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 32px;
      background: radial-gradient(ellipse at 30% 0%, rgba(255, 80, 130, 0.12), transparent 60%);
      pointer-events: none;
      z-index: -1;
    }

    .letter-card h2 {
      font-size: 2rem;
      font-weight: 400;
      color: #ff9eb8;
      margin: 0 0 1.2rem 0;
      letter-spacing: 0.02em;
      border-bottom: 1px solid rgba(255, 120, 150, 0.22);
      padding-bottom: 0.9rem;
      position: relative;
    }
    .letter-card h2::after {
      content: '♥';
      position: absolute;
      right: 0;
      top: 0.1rem;
      color: #ff4d7a;
      font-size: 1.2rem;
      opacity: 0.7;
      filter: drop-shadow(0 0 8px #ff1a5e);
    }
    .letter-card p {
      font-size: 1.1rem;
      line-height: 1.9;
      margin: 1rem 0;
      color: #e8d0da;
      font-style: italic;
    }
    .letter-card .final-line {
      font-size: 1.9rem;
      color: #ff5e8a;
      font-weight: 600;
      text-align: center;
      margin: 2.2rem 0 0.8rem;
      text-shadow: 0 0 30px rgba(255, 60, 110, 0.6), 0 0 60px rgba(255, 0, 60, 0.3);
      font-style: normal;
      letter-spacing: 0.06em;
      animation: lovePulse 2s ease-in-out infinite;
    }
    @keyframes lovePulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .letter-card .signature {
      margin-top: 1.6rem;
      text-align: right;
      color: #ff8aa5;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      font-style: italic;
      opacity: 0.85;
    }
    .close-btn {
      position: absolute;
      top: 16px;
      right: 18px;
      font-size: 1.9rem;
      line-height: 1;
      background: rgba(255, 80, 120, 0.08);
      border: 1px solid rgba(255, 120, 150, 0.2);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff9eb0;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: 'Segoe UI', sans-serif;
      font-weight: 300;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(4px);
    }
    .close-btn:hover {
      color: #fff;
      background: rgba(255, 60, 100, 0.35);
      border-color: rgba(255, 150, 180, 0.5);
      transform: scale(1.08) rotate(90deg);
    }
    .close-btn:active { transform: scale(0.94) rotate(90deg); }

    /* ---- Hint ---- */
    .hint {
      position: fixed;
      bottom: calc(16px + var(--safe-bottom));
      left: 0;
      width: 100%;
      text-align: center;
      color: rgba(255, 100, 140, 0.45);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      z-index: 10;
      pointer-events: none;
      text-transform: uppercase;
      transition: opacity 1.5s ease;
    }

    /* ---- 2D Fallback ---- */
    #fallback-2d {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: none;
      background: #000;
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <div id="logo-layer">
    <svg id="logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Logo">
      <path d="M100 172 C38 110, 8 68, 30 38 C52 8, 92 18, 100 38 C108 18, 148 8, 170 38 C192 68, 162 110, 100 172 Z"
            fill="url(#heartGrad)" stroke="#ff2a4d" stroke-width="3.5" stroke-linejoin="round"/>
      <defs>
        <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff1a3c"/>
          <stop offset="75%" stop-color="#b3001b"/>
          <stop offset="100%" stop-color="#5c000e"/>
        </linearGradient>
      </defs>
      <circle cx="100" cy="100" r="92" stroke="#ff3355" stroke-width="1" stroke-dasharray="6 10" opacity="0.35"/>
    </svg>
  </div>
  <div id="logo-flash"></div>

  <!-- Matrix -->
  <div id="matrix-layer">
    <canvas id="matrix-canvas"></canvas>
    <div id="love-text"></div>
  </div>

  <!-- 3D -->
  <div id="canvas-container"></div>
  <canvas id="fallback-2d"></canvas>

  <!-- Letter -->
  <div id="letter-overlay">
    <div class="letter-card">
      <button class="close-btn" id="close-letter" aria-label="Close letter">×</button>
      <h2>My Dearest Sinu,</h2>
      <p>Some feelings are impossible to explain with words.</p>
      <p>You are the heartbeat behind this little world.</p>
      <p>Every beat carries one message…</p>
      <p class="final-line">I LOVE YOU.</p>
      <div class="signature">— always yours</div>
    </div>
  </div>

  <div class="hint" id="hint-text">drag to rotate · pinch to zoom · tap the heart</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    /* ============================================================
       CONFIG
    ============================================================ */
    const CONFIG = {
      heartbeatSpeed: 1.15,
      particleCount: 220,
      ambientParticleCount: 120,
      maxPixelRatio: 2,
      dragSensitivity: 0.007,
      inertiaDamping: 0.94,
      tapMaxDuration: 320,
      tapMaxDistance: 14,
      zoomMin: 0.55,
      zoomMax: 2.3,
    };

    /* ============================================================
       DOM REFS
    ============================================================ */
    const logoLayer   = document.getElementById('logo-layer');
    const logoFlash   = document.getElementById('logo-flash');
    const matrixLayer = document.getElementById('matrix-layer');
    const matrixCanvas= document.getElementById('matrix-canvas');
    const loveText    = document.getElementById('love-text');
    const letterOverlay = document.getElementById('letter-overlay');
    const closeBtn    = document.getElementById('close-letter');
    const canvasContainer = document.getElementById('canvas-container');
    const fallback2d  = document.getElementById('fallback-2d');
    const hintText    = document.getElementById('hint-text');

    /* ============================================================
       STATE
    ============================================================ */
    let scene, camera, renderer;
    let heartGroup, heartMesh, heartInner, heartHighlight;
    let particleSystem, ambientParticles;
    const clock = new THREE.Clock();

    let isDragging = false;
    let previousPointer = { x: 0, y: 0 };
    let rotationVelocity = { x: 0, y: 0 };
    let targetRotation   = { x: -0.05, y: 0.2 };
    let currentRotation  = { x: -0.05, y: 0.2 };
    let targetZoom  = 1;
    let currentZoom = 1;

    let tapCandidate = false;
    let tapStartTime = 0;
    let tapStartPos  = { x: 0, y: 0 };

    let letterVisible = false;
    let animationFrameId = null;
    let matrixAnimationId = null;
    let introFinished = false;
    let webglOK = true;
    let heartbeatPhase = 0;
    let hintDismissed = false;

    /* ============================================================
       UTIL
    ============================================================ */
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    function dismissHint() {
      if (hintDismissed) return;
      hintDismissed = true;
      hintText.style.opacity = '0';
      setTimeout(() => { hintText.style.display = 'none'; }, 1500);
    }

    /* ============================================================
       LOGO FLASH SEQUENCE
    ============================================================ */
    function startLogoSequence() {
      setTimeout(() => {
        logoFlash.classList.add('active');
        setTimeout(() => {
          logoFlash.classList.remove('active');
          logoLayer.style.opacity = '0';
          setTimeout(() => {
            logoLayer.style.display = 'none';
            startMatrixIntro();
          }, 900);
        }, 140);
      }, 1900);
    }

    /* ============================================================
       MATRIX INTRO — PINK RAIN with "I love you" characters
    ============================================================ */
    function startMatrixIntro() {
      matrixLayer.style.opacity = '1';
      const ctx = matrixCanvas.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio, 2);
      let w = window.innerWidth;
      let h = window.innerHeight;
      matrixCanvas.width  = w * dpr;
      matrixCanvas.height = h * dpr;
      matrixCanvas.style.width  = w + 'px';
      matrixCanvas.style.height = h + 'px';
      ctx.scale(dpr, dpr);

      const fontSize = 15;
      const columns = Math.floor(w / fontSize);
      const drops = new Array(columns).fill(0).map(() => Math.random() * -h / fontSize);

      // Characters spell out "I love you" continuously
      const phrase = 'I love you  ';
      let charIndex = 0;

      // Pink palette
      const pinkBright = '#ffc2d8';
      const pinkMain   = '#ff5e9c';
      const pinkDeep   = '#ff1a5e';

      function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.09)';
        ctx.fillRect(0, 0, w, h);
        ctx.font = `600 ${fontSize}px 'Courier New', monospace`;
        ctx.textAlign = 'center';

        for (let i = 0; i < drops.length; i++) {
          // Pick character from "I love you" phrase
          const ch = phrase[charIndex % phrase.length];
          charIndex++;

          const x = i * fontSize + fontSize / 2;
          const y = drops[i] * fontSize;

          // Random bright sparkle
          const bright = Math.random();
          if (bright > 0.96) {
            ctx.fillStyle = pinkBright;
            ctx.shadowColor = pinkMain;
            ctx.shadowBlur = 14;
          } else {
            // Subtle pink opacity variation
            ctx.fillStyle = `rgba(255, 60, 130, ${0.35 + Math.random() * 0.55})`;
            ctx.shadowBlur = 0;
          }
          ctx.fillText(ch, x, y);

          if (y > h && Math.random() > 0.975) drops[i] = 0;
          drops[i] += 0.55 + Math.random() * 0.7;
        }
        ctx.shadowBlur = 0;
        matrixAnimationId = requestAnimationFrame(drawMatrix);
      }
      drawMatrix();

      // Cinematic typing reveal for "I love you"
      setTimeout(() => {
        loveText.style.opacity = '1';
        typeLoveText();
      }, 1000);

      // Fade out matrix & reveal 3D heart
      setTimeout(() => {
        matrixLayer.style.opacity = '0';
        loveText.style.opacity = '0';
        setTimeout(() => {
          cancelAnimationFrame(matrixAnimationId);
          matrixAnimationId = null;
          matrixLayer.style.display = 'none';
          introFinished = true;
          if (heartGroup) heartGroup.visible = true;
        }, 1100);
      }, 4200);
    }

    function typeLoveText() {
      const full = 'I love you';
      loveText.innerHTML = '';
      let i = 0;
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      loveText.appendChild(cursor);

      const typer = setInterval(() => {
        if (i <= full.length) {
          loveText.textContent = full.slice(0, i);
          loveText.appendChild(cursor);
          i++;
        } else {
          clearInterval(typer);
          setTimeout(() => { if (cursor.parentNode) cursor.remove(); }, 1200);
        }
      }, 130);
    }

    /* ============================================================
       HEART SHAPE — correct 3D heart silhouette
    ============================================================ */
    function createHeartShape() {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0.55);
      // left lobe
      shape.bezierCurveTo(-0.25, 0.78, -0.55, 0.92, -0.85, 0.78);
      shape.bezierCurveTo(-1.18, 0.62, -1.22, 0.18, -0.95, -0.18);
      // left side to point
      shape.bezierCurveTo(-0.72, -0.48, -0.38, -0.78, 0, -1.18);
      // right side up
      shape.bezierCurveTo(0.38, -0.78, 0.72, -0.48, 0.95, -0.18);
      // right lobe
      shape.bezierCurveTo(1.22, 0.18, 1.18, 0.62, 0.85, 0.78);
      shape.bezierCurveTo(0.55, 0.92, 0.25, 0.78, 0, 0.55);
      return shape;
    }

    /* ============================================================
       3D INIT
    ============================================================ */
    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 7.4);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance',
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.maxPixelRatio));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      canvasContainer.appendChild(renderer.domElement);

      /* ---- Lighting ---- */
      scene.add(new THREE.AmbientLight(0x2a1a20, 1.2));

      const keyLight = new THREE.PointLight(0xff5e7a, 1.6, 30);
      keyLight.position.set(4, 5, 6);
      scene.add(keyLight);

      const fillLight = new THREE.PointLight(0xff1a3c, 1.1, 30);
      fillLight.position.set(-5, 2, 5);
      scene.add(fillLight);

      const rimLight = new THREE.PointLight(0xff8090, 0.9, 20);
      rimLight.position.set(0, -4, -6);
      scene.add(rimLight);

      const softGlow = new THREE.PointLight(0x330011, 1.5, 40);
      softGlow.position.set(0, 1, -8);
      scene.add(softGlow);

      /* ---- Heart Group ---- */
      heartGroup = new THREE.Group();
      heartGroup.visible = false;
      scene.add(heartGroup);

      /* ---- Main glass heart ---- */
      const heartShape = createHeartShape();
      const scaledShape = new THREE.Shape(
        heartShape.getPoints(64).map(p => new THREE.Vector2(p.x * 1.35, p.y * 1.35))
      );

      const extrudeSettings = {
        depth: 0.78,
        bevelEnabled: true,
        bevelSegments: 10,
        steps: 3,
        bevelSize: 0.28,
        bevelThickness: 0.32,
        curveSegments: 32,
      };

      const heartGeo = new THREE.ExtrudeGeometry(scaledShape, extrudeSettings);
      heartGeo.center();

      const heartMat = new THREE.MeshPhysicalMaterial({
        color: 0xc40022,
        emissive: 0x2a0008,
        metalness: 0.12,
        roughness: 0.12,
        clearcoat: 1.0,
        clearcoatRoughness: 0.06,
        transparent: true,
        opacity: 0.94,
        transmission: 0.28,
        thickness: 0.9,
        ior: 1.45,
        envMapIntensity: 1.0,
        side: THREE.DoubleSide,
        flatShading: false,
      });

      heartMesh = new THREE.Mesh(heartGeo, heartMat);
      heartGroup.add(heartMesh);

      /* ---- Inner emissive heart ---- */
      const innerGeo = new THREE.ExtrudeGeometry(
        new THREE.Shape(heartShape.getPoints(48).map(p => new THREE.Vector2(p.x * 1.05, p.y * 1.05))),
        { depth: 0.45, bevelEnabled: true, bevelSegments: 6, steps: 1, bevelSize: 0.16, bevelThickness: 0.2, curveSegments: 24 }
      );
      innerGeo.center();
      const innerMat = new THREE.MeshStandardMaterial({
        color: 0xff2244,
        emissive: 0xcc0022,
        emissiveIntensity: 1.2,
        transparent: true,
        opacity: 0.18,
        side: THREE.DoubleSide,
      });
      heartInner = new THREE.Mesh(innerGeo, innerMat);
      heartInner.scale.setScalar(0.72);
      heartGroup.add(heartInner);

      /* ---- Specular highlight ---- */
      const highlightGeo = new THREE.ExtrudeGeometry(
        new THREE.Shape(heartShape.getPoints(24).map(p => new THREE.Vector2(p.x * 0.45, p.y * 0.45))),
        { depth: 0.15, bevelEnabled: true, bevelSegments: 4, steps: 1, bevelSize: 0.1, bevelThickness: 0.08, curveSegments: 16 }
      );
      highlightGeo.center();
      const highlightMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        emissive: 0xff8899,
        emissiveIntensity: 0.6,
        transparent: true,
        opacity: 0.35,
        roughness: 0.05,
        metalness: 0.0,
        clearcoat: 1.0,
        side: THREE.DoubleSide,
      });
      heartHighlight = new THREE.Mesh(highlightGeo, highlightMat);
      heartHighlight.scale.setScalar(0.38);
      heartHighlight.position.set(-0.25, 0.55, 0.55);
      heartGroup.add(heartHighlight);

      /* ---- Particles ---- */
      createParticles();
      createAmbientParticles();

      /* ---- Interaction ---- */
      setupInteraction();
      window.addEventListener('resize', onWindowResize);
      animate();
    }

    /* ============================================================
       PARTICLES
    ============================================================ */
    function makeSpriteTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.25, 'rgba(255,190,210,0.85)');
      g.addColorStop(0.6, 'rgba(255,60,120,0.35)');
      g.addColorStop(1, 'rgba(255,0,80,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 64);
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    function createParticles() {
      const count = CONFIG.particleCount;
      const positions = new Float32Array(count * 3);
      const colors    = new Float32Array(count * 3);
      const sizes     = new Float32Array(count);

      const red     = new THREE.Color(0xff2a4d);
      const crimson = new THREE.Color(0xa8001a);
      const pink    = new THREE.Color(0xff8098);
      const green   = new THREE.Color(0x44ff88);

      for (let i = 0; i < count; i++) {
        const radius = 2.4 + Math.random() * 3.2;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const x = Math.sin(phi) * Math.cos(theta) * radius;
        const y = Math.sin(phi) * Math.sin(theta) * radius * 0.95;
        const z = Math.cos(phi) * radius * 0.9;

        positions[i*3]   = x;
        positions[i*3+1] = y * 0.85;
        positions[i*3+2] = z;

        const roll = Math.random();
        let c;
        if (roll < 0.5) c = red;
        else if (roll < 0.82) c = crimson;
        else if (roll < 0.94) c = pink;
        else c = green;

        colors[i*3]   = c.r;
        colors[i*3+1] = c.g;
        colors[i*3+2] = c.b;
        sizes[i] = 0.06 + Math.random() * 0.16;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

      const mat = new THREE.PointsMaterial({
        size: 0.22,
        map: makeSpriteTexture(),
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true,
        opacity: 0.9,
      });

      particleSystem = new THREE.Points(geo, mat);
      heartGroup.add(particleSystem);
    }

    function createAmbientParticles() {
      const count = CONFIG.ambientParticleCount;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        const r = 5 + Math.random() * 10;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        positions[i*3]   = Math.sin(phi) * Math.cos(theta) * r;
        positions[i*3+1] = Math.sin(phi) * Math.sin(theta) * r * 0.7;
        positions[i*3+2] = Math.cos(phi) * r;

        const c = Math.random() > 0.85 ? new THREE.Color(0x44ff88) : new THREE.Color(0xff3355);
        colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size: 0.1,
        map: makeSpriteTexture(),
        vertexColors: true,
        transparent: true,
        opacity: 0.35,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true,
      });

      ambientParticles = new THREE.Points(geo, mat);
      scene.add(ambientParticles);
    }

    /* ============================================================
       ANIMATION LOOP
    ============================================================ */
    function animate() {
      animationFrameId = requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);

      heartbeatPhase += delta * CONFIG.heartbeatSpeed;
      const beat =
        Math.sin(heartbeatPhase * 2.1) * 0.022 +
        Math.sin(heartbeatPhase * 1.05 + 0.5) * 0.014 +
        Math.sin(heartbeatPhase * 4.3) * 0.006;

      const scale = 1 + beat;
      if (heartGroup) heartGroup.scale.setScalar(scale);

      if (heartInner) {
        const innerPulse = 0.72 + Math.sin(heartbeatPhase * 2.6) * 0.035;
        heartInner.scale.setScalar(innerPulse);
        heartInner.material.emissiveIntensity = 1.0 + Math.sin(heartbeatPhase * 2.6) * 0.4;
      }

      if (heartHighlight) {
        heartHighlight.material.emissiveIntensity = 0.4 + Math.sin(heartbeatPhase * 3.1 + 1.2) * 0.25;
      }

      if (!isDragging && !letterVisible) {
        rotationVelocity.x *= CONFIG.inertiaDamping;
        rotationVelocity.y *= CONFIG.inertiaDamping;
        targetRotation.x += rotationVelocity.x * delta * 60;
        targetRotation.y += rotationVelocity.y * delta * 60;
      }

      currentRotation.x += (targetRotation.x - currentRotation.x) * 0.12;
      currentRotation.y += (targetRotation.y - currentRotation.y) * 0.12;

      targetRotation.x = clamp(targetRotation.x, -0.9, 0.9);

      if (heartGroup) {
        heartGroup.rotation.x = currentRotation.x;
        heartGroup.rotation.y = currentRotation.y;
      }

      currentZoom += (targetZoom - currentZoom) * 0.1;
      if (camera) {
        camera.position.z = 7.4 / currentZoom;
        camera.lookAt(0, 0, 0);
      }

      if (ambientParticles) {
        ambientParticles.rotation.y += 0.0003;
        ambientParticles.rotation.x += 0.0001;
      }
      if (particleSystem) {
        particleSystem.rotation.y += 0.0006;
      }

      if (renderer) renderer.render(scene, camera);
    }

    /* ============================================================
       INTERACTION
    ============================================================ */
    function setupInteraction() {
      const el = renderer.domElement;

      el.addEventListener('pointerdown', onPointerDown, { passive: false });
      el.addEventListener('pointermove', onPointerMove, { passive: false });
      el.addEventListener('pointerup',   onPointerUp,   { passive: false });
      el.addEventListener('pointercancel', onPointerUp, { passive: false });
      el.addEventListener('wheel', onWheel, { passive: false });
      el.addEventListener('contextmenu', e => e.preventDefault());

      let pinchStartDist = 0;
      let pinchStartZoom = 1;
      let isPinching = false;

      el.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2 && !letterVisible) {
          e.preventDefault();
          isPinching = true;
          isDragging = false;
          tapCandidate = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          pinchStartDist = Math.hypot(dx, dy);
          pinchStartZoom = targetZoom;
        }
      }, { passive: false });

      el.addEventListener('touchmove', (e) => {
        if (isPinching && e.touches.length === 2 && !letterVisible) {
          e.preventDefault();
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          if (pinchStartDist > 0) {
            const factor = dist / pinchStartDist;
            targetZoom = clamp(pinchStartZoom * factor, CONFIG.zoomMin, CONFIG.zoomMax);
          }
        }
      }, { passive: false });

      el.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          isPinching = false;
          pinchStartDist = 0;
        }
      }, { passive: false });

      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        hideLetter();
      });
      letterOverlay.addEventListener('pointerdown', (e) => e.stopPropagation());
    }

    function onPointerDown(e) {
      if (letterVisible) return;
      e.preventDefault();
      dismissHint();

      const rect = renderer.domElement.getBoundingClientRect();
      const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      const ny = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      const raycaster = new THREE.Raycaster();
      const pointerVec = new THREE.Vector2(nx, ny);
      raycaster.setFromCamera(pointerVec, camera);

      let hitHeart = false;
      if (heartMesh) {
        const hits = raycaster.intersectObject(heartMesh, false);
        hitHeart = hits.length > 0;
      }

      tapCandidate = hitHeart;
      tapStartTime = performance.now();
      tapStartPos = { x: e.clientX, y: e.clientY };

      isDragging = true;
      previousPointer.x = e.clientX;
      previousPointer.y = e.clientY;
      rotationVelocity.x = 0;
      rotationVelocity.y = 0;

      try { renderer.domElement.setPointerCapture(e.pointerId); } catch(_) {}
    }

    function onPointerMove(e) {
      if (!isDragging || letterVisible) return;
      e.preventDefault();

      const dx = e.clientX - previousPointer.x;
      const dy = e.clientY - previousPointer.y;

      const totalDx = e.clientX - tapStartPos.x;
      const totalDy = e.clientY - tapStartPos.y;
      if (Math.hypot(totalDx, totalDy) > CONFIG.tapMaxDistance) {
        tapCandidate = false;
      }

      rotationVelocity.y += dx * CONFIG.dragSensitivity * 0.5;
      rotationVelocity.x += dy * CONFIG.dragSensitivity * 0.5;
      targetRotation.y += dx * CONFIG.dragSensitivity;
      targetRotation.x += dy * CONFIG.dragSensitivity;

      previousPointer.x = e.clientX;
      previousPointer.y = e.clientY;
    }

    function onPointerUp(e) {
      if (letterVisible) return;
      isDragging = false;

      if (tapCandidate) {
        const elapsed = performance.now() - tapStartTime;
        const dx = e.clientX - tapStartPos.x;
        const dy = e.clientY - tapStartPos.y;
        const dist = Math.hypot(dx, dy);
        if (elapsed < CONFIG.tapMaxDuration && dist < CONFIG.tapMaxDistance) {
          showLetter();
        }
      }
      tapCandidate = false;

      try { renderer.domElement.releasePointerCapture(e.pointerId); } catch(_) {}
    }

    function onWheel(e) {
      if (letterVisible) return;
      e.preventDefault();
      dismissHint();
      targetZoom = clamp(targetZoom - e.deltaY * 0.0016, CONFIG.zoomMin, CONFIG.zoomMax);
    }

    /* ============================================================
       LETTER
    ============================================================ */
    function showLetter() {
      letterVisible = true;
      letterOverlay.classList.add('visible');
      rotationVelocity.x = 0;
      rotationVelocity.y = 0;
      isDragging = false;
      tapCandidate = false;
    }

    function hideLetter() {
      letterVisible = false;
      letterOverlay.classList.remove('visible');
    }

    /* ============================================================
       RESIZE
    ============================================================ */
    function onWindowResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (camera && renderer) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.maxPixelRatio));
      }
    }

    /* ============================================================
       WEBGL CHECK + 2D FALLBACK
    ============================================================ */
    function webglSupported() {
      try {
        const c = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
      } catch (e) { return false; }
    }

    function setupFallback2D() {
      fallback2d.style.display = 'block';
      canvasContainer.style.display = 'none';
      const ctx = fallback2d.getContext('2d');

      function resize() {
        const dpr = Math.min(window.devicePixelRatio, 2);
        fallback2d.width  = window.innerWidth * dpr;
        fallback2d.height = window.innerHeight * dpr;
        fallback2d.style.width  = window.innerWidth + 'px';
        fallback2d.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      let phase = 0;

      function draw() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        phase += 0.016;
        const beat = Math.sin(phase * 2.4) * 0.03 + 1;
        const cx = w / 2;
        const cy = h / 2;
        const s = Math.min(w, h) * 0.36 * beat;

        ctx.save();
        ctx.shadowColor = '#ff2a4d';
        ctx.shadowBlur = 60;

        ctx.beginPath();
        ctx.moveTo(cx, cy + s * 0.5);
        ctx.bezierCurveTo(cx - s*0.2,  cy + s*0.75, cx - s*0.55, cy + s*0.85, cx - s*0.85, cy + s*0.7);
        ctx.bezierCurveTo(cx - s*1.2,  cy + s*0.55, cx - s*1.22, cy + s*0.12, cx - s*0.95, cy - s*0.2);
        ctx.bezierCurveTo(cx - s*0.72, cy - s*0.48, cx - s*0.38, cy - s*0.8,  cx,        cy - s*1.18);
        ctx.bezierCurveTo(cx + s*0.38, cy - s*0.8,  cx + s*0.72, cy - s*0.48, cx + s*0.95, cy - s*0.2);
        ctx.bezierCurveTo(cx + s*1.22, cy + s*0.12, cx + s*1.2,  cy + s*0.55, cx + s*0.85, cy + s*0.7);
        ctx.bezierCurveTo(cx + s*0.55, cy + s*0.85, cx + s*0.2,  cy + s*0.75, cx,        cy + s*0.5);
        ctx.closePath();

        const grad = ctx.createRadialGradient(cx - s*0.2, cy - s*0.4, s*0.1, cx, cy, s*1.3);
        grad.addColorStop(0, '#ff5e7a');
        grad.addColorStop(0.55, '#c40022');
        grad.addColorStop(1, '#4a000e');
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.shadowBlur = 25;
        ctx.strokeStyle = 'rgba(255,90,120,0.6)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();

        for (let i = 0; i < 22; i++) {
          const a = (i / 22) * Math.PI * 2 + phase * 0.3;
          const r = s * (1.4 + Math.sin(phase + i) * 0.2);
          const px = cx + Math.cos(a) * r;
          const py = cy + Math.sin(a) * r * 0.8;
          const alpha = 0.25 + Math.sin(phase * 2 + i) * 0.2;
          ctx.beginPath();
          ctx.fillStyle = i % 5 === 0 ? `rgba(80,255,140,${alpha})` : `rgba(255,90,120,${alpha})`;
          ctx.arc(px, py, 1.6, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }
      draw();

      fallback2d.addEventListener('pointerdown', (e) => {
        if (letterVisible) return;
        const rect = fallback2d.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const s = Math.min(window.innerWidth, window.innerHeight) * 0.36;
        const dx = (x - cx) / s;
        const dy = (y - cy) / s;
        if (Math.abs(dx) < 1.15 && dy > -1.25 && dy < 0.9) {
          if (dx*dx + (dy - 0.35)*(dy - 0.35) < 1.4 || dy > 0.2) {
            showLetter();
          }
        }
      });
    }

    /* ============================================================
       VISIBILITY
    ============================================================ */
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
        if (matrixAnimationId) { cancelAnimationFrame(matrixAnimationId); matrixAnimationId = null; }
      } else {
        if (!animationFrameId && webglOK && renderer) {
          clock.getDelta();
          animate();
        }
      }
    });

    /* ============================================================
       BOOT
    ============================================================ */
    function boot() {
      startLogoSequence();
      webglOK = webglSupported();
      if (webglOK) {
        initThree();
      } else {
        setupFallback2D();
      }
    }

    window.addEventListener('load', boot);

    document.addEventListener('touchmove', (e) => {
      if (e.target === document.body || e.target === canvasContainer) e.preventDefault();
    }, { passive: false });

  </script>
</body>
</html>
